<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Google</title>
    <link rel="icon" type="image/png" href="../img/icone.png">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/cadastroGoogle.css">
</head>

<body>
    <div class="container">
        <h2>Insira seu CPF ou CNPJ</h2>
        <form action="." method="post">
            <label for="cpf-cnpj" class="cpf-cnpj">CPF/CNPJ:</label>
            <input type="text" id="cpf-cnpj" placeholder="Digite seu CPF/CNPJ aqui" required>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
    <script type="module" src="../js/cadastroGoogle.js"></script>
</body>

</html>
